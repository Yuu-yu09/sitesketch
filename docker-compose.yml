services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: sitesketch
      POSTGRES_USER: sitesketch
      POSTGRES_PASSWORD: sitesketch
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sitesketch -d sitesketch"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - sitesketch-postgres:/var/lib/postgresql/data

volumes:
  sitesketch-postgres:
