<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My plans</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='28' height='28' rx='6' fill='%23fff' stroke='%2316283C' stroke-width='2.5'/%3E%3Cpath d='M16 3.5v25M3.5 16h25' stroke='%2316283C' stroke-width='1.4' opacity='.35'/%3E%3Crect x='17.5' y='4.5' width='10' height='10' fill='%23D6452F'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="static/css/fonts.css">
  <link rel="stylesheet" href="static/icons/bootstrap-icons.css">
  <link rel="stylesheet" href="static/css/app.css">
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="dashboard.html" aria-label="SiteSketch dashboard">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <rect x="2" y="2" width="28" height="28" rx="6" fill="#fff" stroke="#16283C" stroke-width="2.5"/>
          <path d="M16 3.5v25M3.5 16h25" stroke="#16283C" stroke-width="1.4" opacity=".35"/>
          <rect x="17.5" y="4.5" width="10" height="10" fill="#D6452F"/>
        </svg>
        SiteSketch
      </a>
      <nav class="topbar-nav" aria-label="Main">
        <a class="navlink" href="dashboard.html" aria-current="page">My plans</a>
        <a class="btn btn-primary btn-sm" href="plan.html">New plan</a>
        <span class="user-chip" id="userChip"><span class="av" aria-hidden="true">?</span><span id="userName">…</span></span>
        <button class="icon-btn" id="logoutBtn" title="Sign out" aria-label="Sign out">
          <i class="bi bi-box-arrow-right" aria-hidden="true"></i>
        </button>
      </nav>
    </div>
  </header>

  <main class="app-main">
    <div class="wrap">
      <div class="page-head">
        <div>
          <h1 id="greeting">My plans</h1>
          <p id="subline">Loading your projects…</p>
        </div>
        <div class="page-head-right">
          <div class="mascot-slot" id="mascotSlot"></div>
          <span class="hand page-note">everything saves automatically</span>
        </div>
      </div>

      <div class="proj-grid" id="grid"></div>
    </div>
  </main>

  <script src="static/js/api.js"></script>
  <script src="static/js/site.js"></script>
  <script src="static/js/mascot.js"></script>
<script src="static/js/pages/dashboard.js"></script>
</body>
</html>
