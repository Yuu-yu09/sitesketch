name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: sitesketch
          POSTGRES_USER: sitesketch
          POSTGRES_PASSWORD: sitesketch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sitesketch -d sitesketch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: development
      DATABASE_URL: postgresql://sitesketch:sitesketch@127.0.0.1:5432/sitesketch
      JWT_SECRET: ci-secret-with-at-least-32-characters
      RUN_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.4.1 --activate
          pnpm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:push
      - run: pnpm check
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm build
