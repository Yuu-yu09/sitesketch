<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Builder</title>
  <link rel="stylesheet" href="static/css/fonts.css">
  <link rel="stylesheet" href="static/icons/bootstrap-icons.css">
  <link rel="stylesheet" href="static/css/app.css">
  <link rel="stylesheet" href="static/css/generated.css">
</head>
<body class="builder-body">
  <header class="builder-top">
    <div class="builder-top-left">
      <button class="icon-btn chrome-toggle" id="railToggle" type="button"
              aria-controls="rail" aria-expanded="true"
              title="Hide the sidebar" aria-label="Hide the sidebar">
        <i class="bi bi-layout-sidebar" aria-hidden="true"></i>
      </button>
      <a class="navlink" href="dashboard.html"><i class="bi bi-chevron-left" aria-hidden="true"></i> My plans</a>
    </div>

    <div class="builder-top-mid">
      <input type="text" id="siteName" class="site-name-input" maxlength="60" aria-label="Website name">
      <span class="save-state" id="saveState"><span class="pip"></span> Saved</span>
    </div>

    <div class="builder-top-right">
      <div class="history-switch" role="group" aria-label="Undo and redo">
        <button type="button" class="icon-btn" id="undoBtn" disabled
                title="Undo (Ctrl+Z)" aria-label="Undo">
          <i class="bi bi-arrow-counterclockwise" aria-hidden="true"></i>
        </button>
        <button type="button" class="icon-btn" id="redoBtn" disabled
                title="Redo (Ctrl+Shift+Z)" aria-label="Redo">
          <i class="bi bi-arrow-clockwise" aria-hidden="true"></i>
        </button>
      </div>
      <button class="btn btn-sm" id="focusBtn" type="button" aria-pressed="false"
              title="Hide the editor chrome and see the whole site">
        <i class="bi bi-arrows-fullscreen" aria-hidden="true"></i> Preview
      </button>
      <div class="device-switch" role="group" aria-label="Preview size">
        <button type="button" class="device-btn" data-device="mobile"
                aria-pressed="false" title="Phone (390 px)">
          <i class="bi bi-phone" aria-hidden="true"></i><span class="sr-only">Phone</span>
        </button>
        <button type="button" class="device-btn" data-device="tablet"
                aria-pressed="false" title="Tablet (820 px)">
          <i class="bi bi-tablet" aria-hidden="true"></i><span class="sr-only">Tablet</span>
        </button>
        <button type="button" class="device-btn is-on" data-device="desktop"
                aria-pressed="true" title="Desktop (full width)">
          <i class="bi bi-laptop" aria-hidden="true"></i><span class="sr-only">Desktop</span>
        </button>
      </div>
      <button class="btn btn-sm" id="menuBtn" type="button" aria-pressed="false">
        <i class="bi bi-list" aria-hidden="true"></i> Menu
      </button>
      <button class="btn btn-sm" id="footerBtn" type="button" aria-pressed="false">
        <i class="bi bi-layout-text-footer" aria-hidden="true"></i> Footer
      </button>
      <button class="btn btn-sm" id="stylesBtn" type="button" aria-pressed="false">
        <i class="bi bi-palette" aria-hidden="true"></i> Design
      </button>
      <button class="btn btn-sm btn-primary" id="publishBtn" type="button">Publish</button>
    </div>
  </header>

  <div class="builder-shell" id="shell">
    <!-- left rail: pages and the section library -->
    <aside class="builder-rail" id="rail" aria-label="Pages and sections">
      <div class="rail-pages">
        <h2 class="rail-title">Pages</h2>
        <div class="tab-row" id="pageTabs" role="tablist" aria-label="Pages"></div>
        <button class="rail-add" id="addPage" type="button">
          <i class="bi bi-plus-lg" aria-hidden="true"></i> Add page
        </button>
      </div>

      <div class="rail-library">
        <h2 class="rail-title">Add a section</h2>
        <p class="palette-group">Structure</p>
        <div class="palette-list" id="paletteStructure"></div>
        <p class="palette-group">Content</p>
        <div class="palette-list" id="paletteContent"></div>
      </div>
    </aside>

    <!-- the page itself: this is the editor -->
    <div class="device-stage" id="deviceStage">
      <main class="builder-canvas" id="canvas" tabindex="-1" aria-label="Your website, editable"></main>
      <!-- device preview lives in a real frame so the page's own media
           queries fire; squeezing a div would not show a true phone layout -->
      <div class="device-frame" id="deviceFrame" hidden>
        <div class="device-chrome" id="deviceChrome"></div>
        <iframe id="previewFrame" title="Preview of your website"
                src="preview.html" loading="lazy"></iframe>
      </div>
    </div>

    <!-- design settings, always on the right -->
    <aside class="builder-panel" id="stylesPanel" aria-label="Design settings">
      <div class="panel-bar">
        <strong id="panelTitle">Design</strong>
        <button class="icon-btn" id="panelClose" type="button" aria-label="Close the design panel">
          <i class="bi bi-x-lg" aria-hidden="true"></i>
        </button>
      </div>
      <div id="panelBody"></div>
    </aside>
  </div>

  <script src="static/js/api.js"></script>
  <script src="static/js/site.js"></script>
  <script src="static/js/design.js"></script>
  <script src="static/js/editor.js"></script>
  <script src="static/js/history.js"></script>
  <script src="static/js/crop.js"></script>
  <script src="static/js/editorui.js"></script>
  <script src="static/js/vendor/Sortable.min.js"></script>
<script src="static/js/pages/builder.js"></script>
</body>
</html>
